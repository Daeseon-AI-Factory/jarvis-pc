name: Release

# tag push 시 박은 거 — vX.Y.Z 태그.
# 사용 (사용자 본인):
#   git tag v0.3.0-beta1
#   git push origin v0.3.0-beta1
#
# Notarization 박는 거 (사용자 본인 박은 후만 가능):
#   GitHub Secret 박음:
#     CODE_SIGN_ID: "Developer ID Application: Your Name (TEAMID)"
#     CODE_SIGN_CERT_BASE64: cert.p12 박은 거 base64
#     CODE_SIGN_CERT_PASS: cert password
#     NOTARY_APPLE_ID: apple ID
#     NOTARY_TEAM_ID: team ID (10 char)
#     NOTARY_APP_PASSWORD: app-specific password

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build + Notarize + GitHub Release
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      # === Code sign cert 박음 (secrets 박혀있을 때만) ===

      - name: Import code signing certificate
        if: env.CODE_SIGN_CERT_BASE64 != ''
        env:
          CODE_SIGN_CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
          CODE_SIGN_CERT_PASS: ${{ secrets.CODE_SIGN_CERT_PASS }}
        run: |
          echo "$CODE_SIGN_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p actions ci.keychain
          security import /tmp/cert.p12 -k ci.keychain \
            -P "$CODE_SIGN_CERT_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions ci.keychain
          rm /tmp/cert.p12

      - name: Build .app (notarized if secrets 박혀있음)
        env:
          CODE_SIGN_ID: ${{ secrets.CODE_SIGN_ID }}
          NOTARIZE: ${{ secrets.NOTARY_APP_PASSWORD && '1' || '0' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          if [[ -n "$NOTARY_APP_PASSWORD" ]]; then
            xcrun notarytool store-credentials ScreenBridge \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_APP_PASSWORD"
          fi
          ./scripts/build-app.sh

      - name: Build DMG
        run: |
          DMG_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-dmg.sh

      - name: Compute SHA256
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
